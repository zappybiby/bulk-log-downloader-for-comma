name: Build Firefox extension

on:
  workflow_dispatch:
  pull_request:
    paths: ['firefox/**', 'scripts/package-firefox.py', '.github/workflows/firefox-prerelease.yml']
  push:
    branches: ['main']
    tags: ['firefox-v*']
    paths: ['firefox/manifest.json', '.github/workflows/firefox-prerelease.yml']

permissions:
  contents: read

concurrency:
  group: firefox-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'import json; print(json.load(open("firefox/manifest.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "firefox-v$version"
      - name: Build XPI and checksum
        run: python3 scripts/package-firefox.py
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: |
            dist-firefox/*.xpi
            dist-firefox/*.xpi.sha256
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/firefox-v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: firefox-extension
          path: dist-firefox
      - name: Publish Firefox release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("firefox/manifest.json"))["version"])')"
          tag="firefox-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          sed "s/comma-firefox-0.0.1-unsigned.xpi/comma-firefox-$version-unsigned.xpi/g" .github/firefox-release-notes.md > "$RUNNER_TEMP/firefox-notes.md"
          gh release create "$tag" dist-firefox/*.xpi dist-firefox/*.xpi.sha256 \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Extension Firefox Nightly for Android" \
            --notes-file "$RUNNER_TEMP/firefox-notes.md"
      - name: Remove superseded Firefox previews
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view firefox-v0.0.1 >/dev/null
          for tag in firefox-v0.4.0 firefox-v0.4.1; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes
            fi
          done
