name: Build Firefox extension

on:
  workflow_dispatch:
  pull_request:
    paths: ['firefox/**', 'scripts/package-firefox.py', '.github/workflows/firefox-prerelease.yml']
  push:
    branches: ['codex/firefox-android-prototype']
    tags: ['firefox-v*']
    paths: ['firefox/**', 'scripts/package-firefox.py', '.github/workflows/firefox-prerelease.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'import json; print(json.load(open("firefox/manifest.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "firefox-v$version"
      - name: Build XPI and checksum
        run: python3 scripts/package-firefox.py
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: |
            dist-firefox/*.xpi
            dist-firefox/*.xpi.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/firefox-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firefox-extension
          path: dist-firefox
      - name: Publish unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-firefox/*.xpi dist-firefox/*.xpi.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "$GITHUB_REF_NAME — unsigned Firefox Android preview" \
            --notes "Unsigned Firefox Nightly Android extension. Includes the XPI and SHA-256 checksum."
