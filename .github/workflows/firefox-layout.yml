name: Firefox extension compact layout

on:
  workflow_dispatch:
  push:
    branches: ['codex/firefox-android*']
    paths: ['firefox/**', 'tests/layout-preview.cjs', '.github/workflows/firefox-layout.yml']

permissions:
  contents: read

concurrency:
  group: firefox-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/ui-tools" --no-audit --no-fund playwright@1.62.1
      - name: Render public synthetic UI and compare geometry
        env:
          NODE_PATH: ${{ runner.temp }}/ui-tools/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p test-artifacts/layout
          set -o pipefail
          node tests/layout-preview.cjs 2>&1 | tee test-artifacts/layout/run.log
      - name: Upload invented screenshots and layout measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-compact-layout
          retention-days: 14
          if-no-files-found: warn
          path: |
            test-artifacts/layout/screenshots/*.png
            test-artifacts/layout/geometry.json
            test-artifacts/layout/run.log
