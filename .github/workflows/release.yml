name: Release Chrome extension

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["manifest.json", ".github/workflows/release.yml"]
    tags: ["chrome-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest JSON
        shell: pwsh
        run: |
          Get-Content -Raw -LiteralPath manifest.json | ConvertFrom-Json | Out-Null

      - name: Build extension ZIP
        shell: pwsh
        run: .\package.ps1

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter *.zip -File
          if ($zip.Count -ne 1) {
            throw "Expected exactly one release ZIP, found $($zip.Count)."
          }

          $version = (Get-Content -Raw manifest.json | ConvertFrom-Json).version
          $tag = "chrome-v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag does not match Chrome manifest version."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag $zip.FullName --target "$env:GITHUB_SHA" --title "Extension Chrome" --notes-file .github/chrome-release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Chrome release failed." }
