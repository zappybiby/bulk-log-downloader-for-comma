name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest JSON
        shell: pwsh
        run: |
          Get-Content -Raw -LiteralPath manifest.json | ConvertFrom-Json | Out-Null

      - name: Build extension ZIP
        shell: pwsh
        run: .\package.ps1

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter *.zip -File
          if ($zip.Count -ne 1) {
            throw "Expected exactly one release ZIP, found $($zip.Count)."
          }

          gh release create "${{ github.ref_name }}" $zip.FullName --generate-notes --title "${{ github.ref_name }}"
