name: Firefox Android recording discovery benchmark

on:
  workflow_dispatch:
  push:
    branches: ['codex/firefox-android*']
    paths: ['bench/recording-discovery/browser/**', 'bench/recording-discovery/run-android.py', '.github/workflows/firefox-discovery-benchmark.yml']

permissions:
  contents: read

concurrency:
  group: discovery-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Stage isolated offline benchmark
        run: |
          npm ci
          python -m pip install 'uiautomator2==3.5.0'
          node bench/recording-discovery/browser/stage.mjs
          node --check bench/recording-discovery/browser/benchmark.js
          python -m py_compile bench/recording-discovery/run-android.py
          npx web-ext lint --source-dir .android-selftest/discovery --warnings-as-errors
      - name: Get official Mozilla Nightly
        run: python tests/android/download-nightly.py android-results/discovery/nightly.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure native Firefox parsing on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android-results/discovery/nightly.apk
            python bench/recording-discovery/run-android.py
      - name: Upload synthetic benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-android-discovery-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            android-results/discovery/*.png
            android-results/discovery/*.xml
            android-results/discovery/*.txt
            android-results/discovery/*.log
            android-results/discovery/*.json
