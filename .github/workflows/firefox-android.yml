name: Firefox Nightly Android synthetic test

on:
  workflow_dispatch:
  push:
    branches: ['firefox-android', 'codex/firefox-android*']
    paths: ['firefox/**', 'tests/android/**', 'tests/selftest/**', 'package*.json', 'tests/*.cjs', 'tests/*.py', 'scripts/**', '.github/workflows/firefox-android.yml']
  pull_request:
    paths: ['firefox/**', 'tests/android/**', 'tests/selftest/**', 'package*.json', 'tests/*.cjs', 'tests/*.py', 'scripts/**', '.github/workflows/firefox-android.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test tooling
        run: |
          npm ci
          python -m pip install 'uiautomator2==3.5.0'
          node tests/android/stage.mjs
      - name: Validate and package the distributable
        run: |
          npm test
          npm run lint:firefox
          npm run package:firefox
      - name: Get official Mozilla Nightly
        run: python tests/android/download-nightly.py android-results/nightly.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Nightly and verify Android downloads
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android-results/nightly.apk
            python tests/android/run.py
      - name: Upload synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-nightly-android-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            android-results/*.png
            android-results/*.xml
            android-results/*.txt
            android-results/*.log
            android-results/*.json
            android-results/comma-selftest-*.zip
