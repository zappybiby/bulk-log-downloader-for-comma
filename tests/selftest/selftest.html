<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Archive Android self-test</title>
  <link rel="stylesheet" href="selftest.css">
  <script src="archive.js" defer></script>
  <script src="selftest.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Firefox Nightly · Android emulator</p>
    <h1>Archive self-test</h1>
    <p>Invented bytes only. Nothing is fetched from comma.</p>
    <div class="buttons">
      <button id="small">Small ZIP test</button>
      <button id="medium">Medium ZIP test</button>
      <button id="large">Disk ZIP test</button>
      <button id="cancel">Cancellation test</button>
      <button id="failure">HTTP failure test</button>
      <button id="ui">Open downloader UI</button>
    </div>
    <p id="status" role="status">SELFTEST READY</p>
    <a id="save" download hidden>Save synthetic ZIP</a>
    <pre id="detail"></pre>
  </main>
</body>
</html>
